name: Meal Reminder

on:
  schedule:
    - cron: '30 15 * * *'   # 9:00 PM IST every day
  workflow_dispatch:          # run manually anytime to test

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Send WhatsApp reminder
        run: node .github/scripts/meal-reminder.mjs
        env:
          SUPABASE_URL:        ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY:        ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          GREEN_API_INSTANCE:  ${{ secrets.GREEN_API_INSTANCE }}
          GREEN_API_TOKEN:     ${{ secrets.GREEN_API_TOKEN }}
          WHATSAPP_GROUP_ID:   ${{ secrets.WHATSAPP_GROUP_ID }}
